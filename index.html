<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Smart Word Assistant</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
</head>

<body>
    <div id="wrapper">
        <header>
            <img src="assets/logo.png" alt=" Ask Me" style="height: 150px;" />
            <h2>Ask Me</h2>
        </header>
        <input type="text" id="wordInput" placeholder="Type or speak a word or question..." />
        <button id="voiceBtn">🎙️Speak</button>
        <div id="definitionBox"></div>
        <div id="suggestions"></div>


        <footer style="text-align: center; padding: 5px; background-color: #f0f0f0; font-size: 19px;">
            <p>© 2025 Smart Assistant. Built by Brian.</p>
        </footer>
    </div>


    <script src="script.js"></script>

</body>

</html>
